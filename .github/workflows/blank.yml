name: WakaTime Stats

on:
  schedule:
    # 23:00 Vietnam time (UTC+7) = 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Stats range
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TOTAL: true

          # ✅ Adds "From: ... To: ..." title line
          SHOW_TITLE: true

          # Optional: show explicit time per language (hh:mm)
          SHOW_TIME: true

          # Optional: nicer blocks
          BLOCKS: "⣀⣄⣤⣦⣶⣷⣿"
          CODE_LANG: txt
